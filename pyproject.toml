[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-briefing"
dynamic = ["version"]
description = "Deterministic personal sports briefing pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
]

[tool.setuptools.dynamic]
version = {attr = "sports_briefing.__version__"}

[tool.setuptools.packages.find]
include = ["sports_briefing*"]
